spring:
  # Datasource will be overridden at runtime by AbstractIntegrationTest
  # @DynamicPropertySource with the Testcontainers PostgreSQL container URL.
  # These fallback values are overridden dynamically — do not use for production.
  datasource:
    url: jdbc:postgresql://localhost:5432/ebookstore_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-secret-key-for-integration-tests-only-not-for-production-use
    expiration-ms: 3600000

# Suppress Springdoc banners and reduce log noise during tests
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
